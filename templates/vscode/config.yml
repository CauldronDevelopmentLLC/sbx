# Visual Studio Code.  Sandboxes made from this template share one read-only
# install, installed on the first run and updated with "sbx update".
# Extensions are per sandbox.
use: [vscode, private-home, app]
command: [/opt/vscode/bin/code]
imports: [$SBX_LIB/global.yml]
pre-hook: >-
  [ -e "$SBX_APPS/vscode/current" ] ||
  "$SBX_LIB/templates/vscode/install"
update-hook: '"$SBX_LIB/templates/vscode/install"'
rules:
  app:
    - The shared VSCode install, read-only.
    - bind: {path: $SBX_APPS/vscode/current, dst: /opt/vscode}
