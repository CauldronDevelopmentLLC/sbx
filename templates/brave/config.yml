# Brave.  Sandboxes made from this template share one read-only install,
# installed on the first run and updated with "sbx update".
use: [browser, private-home, _local]
command: [/opt/brave/brave]
imports: [global]
update-hook: install brave-browser
rules:
  _local:
    - The shared Brave install, read-only.
    - bind: {image: brave-browser, dst: /opt/brave}
