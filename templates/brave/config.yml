# Brave Origin nightly.  Sandboxes made from this template share one
# read-only install, installed on the first run and updated with "sbx update".
use: [browser, private-home, app]
command: [/opt/brave/brave]
imports: [$SBX_LIB/global.yml]
pre-hook: >-
  [ -e "$SBX_APPS/brave/current" ] ||
  "$SBX_LIB/templates/brave/install"
update-hook: '"$SBX_LIB/templates/brave/install"'
rules:
  app:
    - The shared Brave install, read-only.
    - bind: {path: $SBX_APPS/brave/current, dst: /opt/brave}
