# Visual Studio Code.  Sandboxes made from this template share one read-only
# install, installed on the first run and updated with "sbx update".
# Extensions are per sandbox.  Add "cwd" to "use" for the current directory.
use: [private-home, gui, gpu, userns, _local]
command: [/opt/vscode/bin/code]
imports: [global]
update-hook: |
  app=vscode
  . "$SBX_LIB/app.sh"

  api=https://update.code.visualstudio.com/api/update
  info=$(curl -fsS --proto =https \
    "$api/linux-$(arch x64 arm64)/stable/latest" |
    python3 -c '
  import json, sys
  info = json.load(sys.stdin)
  print(info["url"], info["productVersion"], info["sha256hash"])')
  read -r url version sha <<< "$info"

  check "$version"

  fetch "$url" "$tmp/code.tar.gz"
  log "Verifying"
  echo "$sha  $tmp/code.tar.gz" | sha256sum -c --quiet

  log "Unpacking"
  mkdir "$tmp/unpacked"
  tar -xzf "$tmp/code.tar.gz" -C "$tmp/unpacked"
  activate "$version" "$(root "$tmp/unpacked")"
rules:
  _local:
    - >-
      The shared VSCode install, read-only.  The sandbox outlives the "code"
      command, which returns once the window opens.
    - bind: {image: vscode, dst: /opt/vscode}
    - die-with-parent: false
