use: [common, private-home]
command: [bash]
rules:
  common:
    - >-
      Apply common restrictions such as limiting access to environment
      variables and the file system while still allowing basic programs to
      operate correctly.

    - args: [--clearenv, --unshare-pid]
    - die-with-parent: true
    # More restrictive options to consider.
    # - args: [--unshare-uts, --unshare-ipc, --unshare-user, --unshare-cgroup]
    - proc: /proc
    - dev: /dev
    - tmpfs: /tmp
    - env: {PATH: /usr/bin:/bin}
    - env: [LANG, XDG_RUNTIME_DIR, XDG_SESSION_TYPE, TERM, HOME, LOGNAME, USER,
            EDITOR, SANDBOX]
    - bind: /etc
    - symlink: [/usr/lib, /lib]
    - symlink: [/usr/lib64, /lib64]
    - bind: /usr/lib
    - bind: /usr/lib64
    - bind: {path: /usr/libexec, try: true}
    - bind: /usr/bin
    - bind: /usr/share
    - bind: /usr/include
    - symlink: [usr/bin, /bin]
    - symlink: [usr/bin, /sbin]
    - tmpfs: {path: $XDG_RUNTIME_DIR, perms: 0o700}
    - bind: {path: /run/systemd/resolve, try: true}

  host-net:
    - >-
      Share the host's network, including local networks, services listening
      on the host and the host's abstract Unix sockets, e.g. X11's.
    - net: host

  no-net:
    - Loopback only, no network access.
    - net: none

  cups:
    - Allow access to the host's CUPS printing service on localhost:631.
    - host-port: 631

  proxy:
    - >-
      Pass the proxies in sbx's environment, e.g. http_proxy, to the sandbox
      and allow connections to them.  For another proxy use e.g.
      "proxy: http://proxy:3128" in local.yml.
    - proxy: true

  downloads:
    - Bind the user's Downloads directory.
    - bind: {path: $HOME/Downloads, read-write: true}

  make-home:
    - Create some default directories in home.
    - dir: $HOME/.config
    - dir: $HOME/.cache
    - dir: $HOME/.local/share

  data-home:
    - Mounts a readable data directory at /sandbox-data
    - bind:
        path: $SANDBOX_HOME
        dst: /sandbox-data
        try: true
    - env: {SANDBOX_DATA: /sandbox-data}

  private-home:
    - Creates a private writable home directory.
    - bind:
        path: $SANDBOX_HOME
        dst: $HOME
        create: 'skel'
        read-write: true

    - use: [make-home]

  tmp-home:
    - Creates a temporary home directory.
    - tmp-overlay: {path: $HOME, skel: true}
    - env: {debian_chroot: $SANDBOX}
    - use: [make-home]

  cli:
    - Enables typical Command Line Interface options.
    - use: [common, data-home, cwd]

  gui:
    - Enables typical Graphical User Interface options.
    - use: [common, x11, wayland, dbus]

  shell:
    - Options for a temporary shell with typical CLI and GUI options.
    - use: [gui, tmp-home, cwd]

  cwd:
    - Bind the current directory with write permission.
    - bind: {cwd: true, read-write: true}

  x11:
    - >-
      Allow filtered access to an X11 display, via sbx-x11.  Cannot read or
      inject other applications' input or read their windows.  Has hardware
      accelerated graphics.
    - ifdef: [DISPLAY, {x11: filtered}]

  x11-untrusted:
    - >-
      Allow untrusted access to an X11 display, enforced by the X server.  No
      hardware accelerated graphics, themed cursors or copy to the host.
    - ifdef: [DISPLAY, {x11: untrusted}]

  x11-trusted:
    - >-
      Allow trusted access to an X11 display.  Enables hardware accelerated
      graphics but allows reading and injecting input to all applications on
      the display, including keystrokes typed in terminals outside the sandbox.
    - ifdef: [DISPLAY, {x11: trusted}]

  wayland:
    - Allow access to Wayland.
    - ifdef:
      - WAYLAND_DISPLAY
      - env: WAYLAND_DISPLAY
      - bind: $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY

  audio:
    - Enables pulseaudio or pipewire, including microphone access.
    - bind: $XDG_RUNTIME_DIR/pulse/native
    - bind: {path: $HOME/.config/pulse/cookie, try: true}
    - bind: {path: $XDG_RUNTIME_DIR/pipewire-0, try: true}
    - bind: {path: /dev/snd, dev: true, try: true}

  video:
    - Enables access to video devices, e.g. cameras.
    - bind: {path: /dev/v4l, dev: true, try: true}
    - bind: {path: /dev/video0, dev: true, try: true}
    - bind: {path: /dev/video1, dev: true, try: true}
    - bind: {path: /dev/video2, dev: true, try: true}
    - bind: {path: /dev/video3, dev: true, try: true}
    # Device enumeration, e.g. by Chromium
    - bind: {path: /run/udev, try: true}
    - bind: {path: /sys/class, try: true}

  accessibility:
    - >-
      Enables dbus accessibility calls.  Allows reading text from and
      triggering actions in other applications which support accessibility.
    - dbus-forward: org.a11y.Bus
    - bind: {path: $XDG_RUNTIME_DIR/at-spi, try: true}

  dbus:
    - >-
      Gives the sandbox a private D-Bus session bus with sbx's XDG Desktop
      Portal.  Files outside the sandbox are only accessible when chosen in
      the system's file dialog.  Links open in host applications, files only
      after the user chooses the application.
    - portal: [file-chooser, open-uri, print, settings, network-monitor,
               proxy-resolver]
    - dbus-forward: org.freedesktop.portal.IBus
    # Use portals, without pretending to be Flatpak
    - env: {GTK_USE_PORTAL: 1, GDK_DEBUG: portals, GIO_USE_PORTALS: 1,
            QT_QPA_PLATFORMTHEME: xdgdesktopportal}
    # Links opened with xdg-open go to the host's default application, via
    # the OpenURI portal.  Not "gio open", which would run this again.
    - file:
        path: /run/sbx/share/applications/sbx-open-uri.desktop
        data: |
          [Desktop Entry]
          Type=Application
          Name=Open on the host
          Exec=gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop --method org.freedesktop.portal.OpenURI.OpenURI "" %u {}
          MimeType=x-scheme-handler/http;x-scheme-handler/https;x-scheme-handler/mailto;
          NoDisplay=true
    - file:
        path: /run/sbx/xdg/mimeapps.list
        data: |
          [Default Applications]
          x-scheme-handler/http=sbx-open-uri.desktop
          x-scheme-handler/https=sbx-open-uri.desktop
          x-scheme-handler/mailto=sbx-open-uri.desktop
    - env: {XDG_DATA_DIRS: '/run/sbx/share:/usr/local/share:/usr/share',
            XDG_CONFIG_DIRS: '/run/sbx/xdg:/etc/xdg'}

  gpu:
    - Enables GPU access.
    - use: [nvidia]
    - bind: {path: /dev/dri, dev: true}
    - bind: /sys/dev/char
    - bind: /sys/devices

  usb:
    - Enables USB access.
    - bind: {path: /dev/usb}
    - bind: {path: /dev/bus/usb}
    - bind: {path: /sys/bus/usb/devices}

  nvidia:
    - Enables access to NVidia GPU device.
    - bind: {path: /dev/nvidiactl,         dev: true, try: true}
    - bind: {path: /dev/nvidia-uvm,        dev: true, try: true}
    - bind: {path: /dev/nvidia-uvm-tools,  dev: true, try: true}
    - bind: {path: /dev/nvidia-modeset,    dev: true, try: true}
    - bind: {path: /dev/nvidia-caps,       dev: true, try: true}
    - bind: {path: /dev/nvidia0,           dev: true, try: true}
    - bind: {path: /dev/nvidia1,           dev: true, try: true}
    - bind: {path: /sys/module/nvidia,     try: true}
    - bind: {path: /sys/module/nvidia_uvm, try: true}

  userns:
    - >-
      Allow creating user namespaces.  Needed by programs that run their own
      sandbox, such as Chromium and Electron apps, or nested containers.
    - allow-syscalls: [userns]

  browser:
    - >-
      A web browser with GPU, audio including the microphone, cameras,
      ~/Downloads and its own sandbox.
    - use: [gui, gpu, audio, video, downloads, userns]

  vscode:
    - >-
      Visual Studio Code.  Add "cwd" for the current directory.  The sandbox
      outlives the "code" command, which returns once the window opens.
    - use: [gui, gpu, userns]
    - die-with-parent: false

  firefox:
    - A special rule for running the Firefox web browser.
    - ifdef:
      - WAYLAND_DISPLAY
      - env: {MOZ_ENABLE_WAYLAND: 1}

  transmission:
    - Allow access to Transmission bittorrent client
    - dbus-forward: com.transmissionbt.Transmission
